<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>matter-sim</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230F2A3F'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%237FB6D6' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23EAF2F5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="wordmark">matter-sim</div>
        <ol class="ladder" id="ladder" aria-label="Scales of matter"></ol>
      </header>
      <aside class="rail rail-build" id="build" aria-label="Build"></aside>
      <main class="stage" id="stage">
        <canvas id="view"></canvas>
        <div class="overlay view-controls" id="view-controls"></div>
        <div class="overlay scalebar" id="scalebar"><span class="bar"></span><span class="label"></span></div>
        <div class="overlay progress" id="progress" hidden></div>
        <div class="overlay toasts" id="toasts" aria-live="polite"></div>
        <div class="overlay offline" id="offline" hidden>
          <p class="offline-title">The engine isn’t running</p>
          <p>Start it from the project folder with <code>uv run matter-sim</code>. This page reconnects on its own.</p>
        </div>
      </main>
      <aside class="rail rail-measure" id="measure" aria-label="Measurements"></aside>
      <footer class="runbar" id="runbar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
